services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-app}
      POSTGRES_DB: ${POSTGRES_DB:-app}
    ports:
      - "5432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  localstack:
    image: localstack/localstack:latest
    ports:
      - "4566:4566"
    environment:
      - SERVICES=s3

  voicevox:
    image: voicevox/voicevox_engine:cpu-ubuntu20.04-latest
    ports:
      - "50021:50021"

  backend:
    build: ./backend
    ports:
      - "8080:8080"
    environment:
      AUDIO_STORE: ${AUDIO_STORE:-local}
      DATABASE_URL: postgres://${POSTGRES_USER:-app}:${POSTGRES_PASSWORD:-app}@db:5432/${POSTGRES_DB:-app}?sslmode=disable
      VOICEVOX_URL: http://voicevox:50021
      S3_ENDPOINT: ${S3_ENDPOINT:-http://localstack:4566}
      S3_BUCKET: ${S3_BUCKET:-audio-bucket}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-test}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-test}
      AWS_REGION: ${AWS_REGION:-us-east-1}
    volumes:
      - ./backend:/app
      - /go/pkg/mod
      - /root/.cache/go-build
      - /app/tmp
    depends_on:
      db:
        condition: service_healthy
      localstack:
        condition: service_started

  frontend:
    build: ./frontend
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules

volumes:
  db-data: