services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-app}
      POSTGRES_DB: ${POSTGRES_DB:-app}
    ports:
      - "5432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  voicevox:
    image: voicevox/voicevox_engine:cpu-ubuntu20.04-latest
    ports:
      - "50021:50021"

  backend:
    build: ./backend
    # 注: userns_mode: "keep-id" は付けないこと。
    # このイメージは root で動くため、rootless Podman の既定マッピング (コンテナ root = ホストの自分)
    # で所有者は既に一致する。keep-id を付けると逆にプロセスが UID 1000 になり、
    # キャッシュがバインドマウントへ漏れる・マウントポイントが subuid 所有になる問題を実測で確認済み。
    ports:
      - "8080:8080"
    environment:
      AUDIO_STORE: ${AUDIO_STORE:-local}
      DATABASE_URL: postgres://${POSTGRES_USER:-app}:${POSTGRES_PASSWORD:-app}@db:5432/${POSTGRES_DB:-app}?sslmode=disable
      VOICEVOX_URL: http://voicevox:50021
      S3_ENDPOINT: ${S3_ENDPOINT:-}
      S3_BUCKET: ${S3_BUCKET:-}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-}
    volumes:
      # ソースをバインドマウントして air がホットリロードする
      - ./backend:/app
      # Go のモジュールキャッシュ・ビルドキャッシュ・air のビルド出力は匿名ボリュームに逃がし、
      # ホスト側のバインドマウントを汚さないようにする
      - /go/pkg/mod
      - /root/.cache/go-build
      - /app/tmp
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build: ./frontend
    # 注: userns_mode: "keep-id" は付けないこと。
    # このイメージは root で動くため、rootless Podman の既定マッピング (コンテナ root = ホストの自分)
    # で所有者は既に一致する。keep-id を付けると逆にプロセスが UID 1000 になり、
    # キャッシュがバインドマウントへ漏れる・マウントポイントが subuid 所有になる問題を実測で確認済み。
    ports:
      - "5173:5173"
    volumes:
      # ソースをバインドマウントして Vite の HMR を効かせる
      - ./frontend:/app
      # node_modules はイメージ内のものを匿名ボリュームで維持する
      # (ホスト側には node_modules が無いので、隠さないと空で上書きされる)
      - /app/node_modules

volumes:
  db-data:
